site_name: Flutter_Matrix Docs
site_url: https://github.com/PythonnotJava/flutter_matrix

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
theme:
  name: material

plugins:
  - search

nav:
  - Home: index.md
  - API Reference:
    - 类型定义和构建: API/define.md
    - 基础操作: API/basement.md
    - 工具辅助: API/utils.md
    - 函数工具: API/functools.md
    - 纯数学工具: API/math.md
    - 概率论与数理统计: API/random.md
    - 线性代数: API/linalg.md
    - 复数: API/complex.md
    - 可视化处理: API/visualization.md
    - 机器学习工具测试: API/ml.md
    - 几何模型: API/geometry.md
# mkdocs build